[package]
name = "tuicanvas"
version = "0.1.0"
edition = "2024"
description = "Keyboard-driven terminal reader for Canvas LMS"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
cookie = "0.18.2"
html2text = "0.17.3"
open = "5.4.4"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "gzip", "charset", "json", "system-proxy", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-width = "0.2.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[profile.release]
codegen-units = 4
lto = "thin"
strip = "debuginfo"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }
